<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout — Demo Shop</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="checkout">
  <header>
    <a href="index.html" id="brand">Demo Shop</a>
    <nav>
      <a href="index.html">Products</a>
      <a href="cart.html" data-testid="nav-cart">Cart (<span id="cart-count">0</span>)</a>
    </nav>
  </header>
  <main>
    <h1>Checkout</h1>
    <form id="checkout-form">
      <label for="full-name">Full name</label>
      <input id="full-name" name="fullName" required>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>

      <label for="address">Shipping address</label>
      <input id="address" name="address" required>

      <p class="terms-note">By ordering you accept the
        <button type="button" id="terms-link">terms &amp; conditions</button>.
      </p>

      <button type="submit" class="btn btn-primary" data-testid="place-order" disabled>Place order</button>
    </form>
    <section id="order-confirmation" hidden aria-label="Order confirmation">
      <h2>Thank you!</h2>
      <p>Your order <strong id="order-number"></strong> has been placed.</p>
      <a href="index.html">Back to the shop</a>
    </section>
  </main>
  <script src="js/shop.js"></script>
</body>
</html>
